<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CodeFactory</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1b1f24;--mut:#6b7280;--line:#e2e5ea;--acc:#2563eb;--ok:#15803d;--bad:#b91c1c;--warn:#b45309;--okbg:#dcfce7;--badbg:#fee2e2;--warnbg:#fef3c7;--accbg:#dbeafe}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--card:#1a1e24;--fg:#e6e8eb;--mut:#9aa3af;--line:#2a2f37;--acc:#60a5fa;--ok:#4ade80;--bad:#f87171;--warn:#fbbf24;--okbg:#14301f;--badbg:#3b1717;--warnbg:#3a2a0c;--accbg:#172554}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);font-weight:600;display:flex;gap:10px;align-items:center}
header small{color:var(--mut);font-weight:400}
.wrap{display:grid;grid-template-columns:260px 1fr;gap:16px;padding:16px 20px;max-width:1200px;margin:0 auto}
@media (max-width:760px){.wrap{grid-template-columns:1fr;padding:12px 16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
#runs{padding:6px;align-self:start}
.run{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;padding:8px 10px;border-radius:8px;cursor:pointer}
.run:hover{background:var(--bg)}.run.sel{background:var(--accbg)}
.run .id{font-size:12px;color:var(--mut)}
.run .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{padding:18px;min-width:0}
h2{margin:0 0 4px;font-size:18px}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.running{background:var(--accbg);color:var(--acc)}.done{background:var(--okbg);color:var(--ok)}
.failed,.rejected{background:var(--badbg);color:var(--bad)}.wait{background:var(--warnbg);color:var(--warn)}
.stages{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}
.stage{padding:4px 12px;border-radius:8px;border:1px solid var(--line);color:var(--mut);font-size:13px}
.stage.ok{color:var(--ok);border-color:var(--ok)}.stage.bad{color:var(--bad);border-color:var(--bad)}.stage.on{color:var(--acc);border-color:var(--acc)}
.gate{border:2px solid var(--warn);background:var(--warnbg);border-radius:10px;padding:14px;margin:12px 0}
.gate button{font:inherit;font-weight:600;padding:8px 18px;border-radius:8px;border:1px solid var(--line);cursor:pointer;margin-right:8px;background:var(--card);color:var(--fg)}
.gate button.yes{background:var(--ok);color:#fff;border-color:var(--ok)}
details{margin-top:10px;border:1px solid var(--line);border-radius:8px}
summary{padding:8px 12px;cursor:pointer;font-weight:600}
pre{margin:0;padding:12px;overflow:auto;max-height:420px;font:13px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;border-top:1px solid var(--line)}
.l-ok{color:var(--ok)}.l-bad{color:var(--bad)}.l-tag{color:var(--acc);font-weight:600}
#new{padding:12px;margin-bottom:12px}
#new textarea{width:100%;min-height:84px;resize:vertical;font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
#new .row{display:flex;gap:8px;margin-top:8px}
#new select,#new button{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
#new button{flex:1;background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;cursor:pointer}
#new button:disabled{opacity:.5;cursor:default}
#msg{color:var(--bad);font-size:13px;margin-top:6px}
.empty{color:var(--mut);padding:30px;text-align:center}
</style>
</head>
<body>
<header>CodeFactory <small>podgląd na żywo</small></header>
<div class="wrap">
  <div>
    <form id="new" class="card">
      <textarea id="task" placeholder="Opisz, co ma zbudować fabryka (zwykłym językiem)" maxlength="5000" required></textarea>
      <div class="row">
        <select id="mode" title="Tryb autonomii">
          <option value="guided">guided</option><option value="manual">manual</option><option value="auto">auto</option>
        </select>
        <button id="go">Uruchom</button>
      </div>
      <div id="msg"></div>
    </form>
    <div id="runs" class="card"></div>
  </div>
  <div id="main" class="card"><div class="empty">Wybierz run z listy.</div></div>
</div>
<script>
let sel = null, lastRaw = '', lastSel = null, awaitNew = null, lastCount = 0;
const $ = (id) => document.getElementById(id);
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

function kind(state) {
  if (state === 'running') return ['running', 'W TOKU'];
  if (state === 'done') return ['done', 'GOTOWE'];
  if (state.startsWith('rejected')) return ['rejected', state.toUpperCase()];
  return ['failed', state.toUpperCase()];
}

async function listRuns() {
  const runs = await (await fetch('/api/runs')).json();
  const box = $('runs');
  box.replaceChildren();
  if (!runs.length) box.append(el('div', 'empty', 'Brak runów.'));
  for (const r of runs) {
    const b = el('button', 'run' + (r.id === sel ? ' sel' : ''));
    b.append(el('div', 't', r.status.task || '(bez opisu)'), el('div', 'id', r.id + ' · ' + kind(r.status.state)[1]));
    b.onclick = () => { sel = r.id; refresh(); };
    box.append(b);
  }
  if (awaitNew !== null && runs.length > awaitNew) { sel = runs[0].id; awaitNew = null; }  // świeżo wystartowany run
  if (!sel && runs.length) { sel = runs[0].id; }
  lastCount = runs.length;
}

function lastMatch(log, re) { const m = log.split('\n').filter((l) => re.test(l)); return m.length ? m[m.length - 1] : null; }

function stages(d) {
  const log = d.log, out = [];
  const v = lastMatch(log, /verify \d+\]/), r = lastMatch(log, /review \d+\]/);
  out.push(['Spec', d.spec ? 'ok' : 'on']);
  out.push(['Plan', d.tasks ? 'ok' : '']);
  out.push(['Budowa', /build \d+\]/.test(log) ? (v ? 'ok' : 'on') : '']);
  out.push(['Weryfikacja', v ? (/OK/.test(v) ? 'ok' : 'bad') : '']);
  out.push(['Recenzja', r ? (/PASS/.test(r) ? 'ok' : 'bad') : '']);
  const [k] = kind(d.status.state);
  out.push(['Wynik', k === 'done' ? 'ok' : k === 'running' ? '' : 'bad']);
  return out;
}

function section(title, body, open) {
  const d = el('details'); d.open = open;
  d.append(el('summary', null, title));
  d.append(body);
  return d;
}

function logView(log) {
  const pre = el('pre'); pre.id = 'logpre';
  for (const line of log.split('\n')) {
    const s = el('span', /BŁĄD|FAIL|failed/.test(line) ? 'l-bad' : /OK$|PASS|done/.test(line) ? 'l-ok' : /^\[/.test(line) ? 'l-tag' : '', line + '\n');
    pre.append(s);
  }
  return pre;
}

$('new').onsubmit = async (e) => {
  e.preventDefault();
  const btn = $('go'), msg = $('msg');
  btn.disabled = true; msg.textContent = '';
  const before = lastCount;  // przed POST: run może pojawić się na liście, zanim odpowiedź wróci
  try {
    const r = await fetch('/api/start', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ task: $('task').value, mode: $('mode').value }) });
    if (!r.ok) throw new Error((await r.json()).error || r.status);
    $('task').value = ''; awaitNew = before; refresh();
  } catch (err) { msg.textContent = 'Nie udało się wystartować: ' + err.message; }
  btn.disabled = false;
};

async function answer(approve) {
  await fetch(`/api/run/${sel}/answer`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ approve }) });
  refresh();
}

async function showRun() {
  const main = $('main');
  if (!sel) return;
  const raw = await (await fetch('/api/run/' + sel)).text();
  if (raw === lastRaw && sel === lastSel) return;  // nic się nie zmieniło: nie przerysowuj (zachowuje scroll i zaznaczenia)
  lastRaw = raw; lastSel = sel;
  const d = JSON.parse(raw);
  const old = $('logpre');
  const stick = !old || old.scrollHeight - old.scrollTop - old.clientHeight < 30;
  const top = old ? old.scrollTop : 0;
  const openState = Object.fromEntries([...main.querySelectorAll('details')].map((x) => [x.firstChild.textContent, x.open]));
  const [cls, label] = kind(d.status.state);
  const next = document.createDocumentFragment();
  next.append(el('h2', null, d.status.task || sel));
  const meta = el('div');
  meta.append(el('span', 'badge ' + (d.pending ? 'wait' : cls), d.pending ? 'CZEKA NA CIEBIE' : label), el('span', 'id', ' tryb: ' + (d.status.mode || '?')));
  next.append(meta);
  const st = el('div', 'stages');
  for (const [n, c] of stages(d)) st.append(el('span', 'stage ' + c, n));
  next.append(st);
  if (d.pending) {
    const g = el('div', 'gate');
    g.append(el('div', null, 'Zatwierdzić: ' + (d.pending.gate === 'spec' ? 'specyfikację' : d.pending.gate === 'plan' ? 'plan' : d.pending.gate) + '? (treść poniżej)'));
    const yes = el('button', 'yes', 'Zatwierdź'), no = el('button', null, 'Odrzuć');
    yes.onclick = () => answer(true); no.onclick = () => answer(false);
    g.append(el('div', null, ' '), yes, no);
    next.append(g);
  }
  if (/^(failed|rejected)/.test(d.status.state)) {
    const b = el('button', null, 'Wznów run');
    b.onclick = async () => { b.disabled = true; await fetch(`/api/run/${sel}/resume`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }); refresh(); };
    next.append(b);
  }
  if (d.spec) next.append(section('Specyfikacja', el('pre', null, d.spec), d.pending?.gate === 'spec' || openState['Specyfikacja'] === true));
  if (d.tasks) next.append(section('Plan zadań', el('pre', null, d.tasks), d.pending?.gate === 'plan' || openState['Plan zadań'] === true));
  next.append(section('Log', logView(d.log), openState['Log'] !== false));
  main.replaceChildren(next);
  const cur = $('logpre');
  if (cur) cur.scrollTop = stick ? cur.scrollHeight : top;
}

async function refresh() {
  try { await listRuns(); await showRun(); } catch (e) { $('main').replaceChildren(el('div', 'empty', 'Brak połączenia z serwerem GUI.')); }
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
